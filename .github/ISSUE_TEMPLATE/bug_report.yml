name: 버그 제보
description: PR Map이 잘못 동작할 때 알려 주세요.
labels: [bug]
body:
  - type: textarea
    id: symptom
    attributes:
      label: 증상
      description: 어떤 결과를 기대했고 실제로 어떻게 됐는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 같은 문제를 다시 만들 수 있는 순서를 적어 주세요.
      placeholder: |
        1. 실행한 명령이나 PR 이벤트
        2. 그다음 일어난 일
    validations:
      required: true
  - type: dropdown
    id: runner
    attributes:
      label: 실행 방식
      options:
        - 로컬 /pr-map
        - GitHub Actions
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 버전
      description: 사용한 PR Map 커밋이나 태그, Claude Code 버전을 적어 주세요.
      placeholder: "예: v1, 2.1.318"
  - type: input
    id: pull-request
    attributes:
      label: PR 또는 Actions 실행 링크
      description: 공개되어 있으면 적어 주세요.
  - type: textarea
    id: logs
    attributes:
      label: 로그
      description: 이슈는 공개됩니다. API 키, 토큰, 공개하면 안 되는 코드를 지운 뒤 붙여 주세요.
      render: text
