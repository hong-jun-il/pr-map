name: PR Map
description: PR의 변경을 파일별 동작 트리와 코드 근거로 분석해 PR 댓글로 게시합니다.

inputs:
  provider:
    description: 분석에 쓸 AI 공급자 (claude, codex, gemini)
    required: false
    default: claude
  api-key:
    description: 선택한 공급자의 API 키. 저장소 시크릿으로 넘깁니다.
    required: false
  anthropic-api-key:
    description: 이전 입력 이름. api-key를 쓰세요.
    required: false
  github-token:
    description: PR 조회와 댓글 게시에 쓰는 토큰. 분석 에이전트에는 넘기지 않습니다.
    required: false
    default: ${{ github.token }}
  model:
    description: 분석에 쓸 모델. 비우면 공급자의 기본값을 씁니다.
    required: false
  max-turns:
    description: 분석 에이전트의 최대 턴 수 (claude, gemini)
    required: false
    default: "80"
  max-budget-usd:
    description: 실행 한 번의 비용 상한(USD, claude만). 추정치라 실제 청구액과 다를 수 있습니다.
    required: false
    default: "5"
  cli-version:
    description: 설치할 공급자 CLI 버전. 비우면 검증한 고정 버전을 씁니다.
    required: false

runs:
  using: composite
  steps:
    - id: check-key
      name: API 키 확인
      shell: bash
      env:
        PR_MAP_PROVIDER: ${{ inputs.provider }}
        PR_MAP_API_KEY: ${{ inputs.api-key || inputs.anthropic-api-key }}
      run: |
        if [ -z "$PR_MAP_API_KEY" ]; then
          echo "::error::$PR_MAP_PROVIDER API 키 시크릿이 없습니다. 저장소 Settings > Secrets and variables > Actions에서 등록하세요."
          exit 1
        fi

    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    - id: collect
      name: 변경 내용 수집
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GIT_TERMINAL_PROMPT: "0"
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: bash "$GITHUB_ACTION_PATH/action/collect.sh"

    - id: install-agent
      name: 공급자 CLI 설치
      if: steps.collect.outputs.skip != 'true'
      shell: bash
      env:
        PR_MAP_PROVIDER: ${{ inputs.provider }}
        PR_MAP_CLI_VERSION: ${{ inputs.cli-version }}
      run: bash "$GITHUB_ACTION_PATH/action/install-agent.sh"

    # Gemini는 셸을 허용하지 않아 격리 도구가 필요 없다.
    - id: sandbox
      name: 하위 프로세스 격리 준비
      if: steps.collect.outputs.skip != 'true' && inputs.provider != 'gemini'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/action/sandbox.sh"

    # PR 코드를 읽는 단계다. GitHub 토큰을 넘기지 않는다.
    - id: analyze
      name: PR 분석
      if: steps.collect.outputs.skip != 'true'
      shell: bash
      env:
        PR_MAP_PROVIDER: ${{ inputs.provider }}
        PR_MAP_API_KEY: ${{ inputs.api-key || inputs.anthropic-api-key }}
        PR_MAP_MODEL: ${{ inputs.model }}
        PR_MAP_MAX_TURNS: ${{ inputs.max-turns }}
        PR_MAP_MAX_BUDGET_USD: ${{ inputs.max-budget-usd }}
      run: bash "$GITHUB_ACTION_PATH/action/analyze.sh"

    - id: build
      name: 뷰어와 댓글 빌드
      if: steps.collect.outputs.skip != 'true'
      shell: bash
      env:
        PR_MAP_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: node "$GITHUB_ACTION_PATH/skill/pr-map/scripts/pr-map.js" build

    # 압축하지 않아야 댓글 링크를 눌렀을 때 브라우저에서 바로 열린다.
    - id: upload
      uses: actions/upload-artifact@v7
      if: steps.collect.outputs.skip != 'true'
      with:
        path: .pr-map/viewer/index.html
        archive: false
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 14

    - id: publish
      name: PR 댓글 게시
      if: steps.collect.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_MAP_VIEWER_URL: ${{ steps.upload.outputs.artifact-url }}
      run: node "$GITHUB_ACTION_PATH/skill/pr-map/scripts/pr-map.js" publish
